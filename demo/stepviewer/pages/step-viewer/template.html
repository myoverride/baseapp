
<v-container fluid class="pa-0 d-flex flex-column overflow-hidden bg-black" style="height: calc(100vh - 64px);">
  <v-toolbar color="grey-darken-4" density="compact" elevation="2" style="flex-shrink: 0;">
    <v-icon start class="ml-2 text-white">mdi-cube-scan</v-icon>
    <v-toolbar-title class="text-body-1 font-weight-bold text-white">Dijital İkiz (STEP Viewer)</v-toolbar-title>
    <v-spacer></v-spacer>
    
    <v-btn variant="outlined" color="green-accent-3" @click="fileInput.click()" class="text-none">
      <v-icon start>mdi-upload</v-icon> STEP Dosyası Yükle (.step, .stp)
    </v-btn>
    <input type="file" ref="fileInput" style="display: none" accept=".step, .stp" @change="handleFileUpload" />
  </v-toolbar>

  <div class="flex-grow-1 position-relative" style="min-height: 0; width: 100%;">
    <div v-if="loading" class="d-flex flex-column align-center justify-center h-100 w-100 position-absolute bg-black" style="z-index: 1000; opacity: 0.8;">
        <v-progress-circular indeterminate color="green-accent-3" size="64"></v-progress-circular>
        <span class="mt-4 text-h6 text-green-accent-3">{{ loadingText }}</span>
    </div>
    
    <div v-if="!loading" class="position-absolute pa-3 rounded" style="top: 10px; right: 10px; z-index: 10; width: 300px; background: rgba(30,30,30,0.85); border: 1px solid #444;">
      <div class="text-subtitle-2 mb-2 text-white font-weight-bold">
        <v-icon size="small" class="mr-1 text-white">mdi-knife</v-icon> Kesit Görünüm (Clipping)
      </div>
      
      <div class="d-flex align-center mb-1">
        <div style="width: 20px" class="text-red font-weight-bold">X</div>
        <v-slider v-model="clipX" :min="-100" :max="100" hide-details class="ml-2" color="red"></v-slider>
      </div>
      
      <div class="d-flex align-center mb-1">
        <div style="width: 20px" class="text-green font-weight-bold">Y</div>
        <v-slider v-model="clipY" :min="0" :max="150" hide-details class="ml-2" color="green"></v-slider>
      </div>
      
      <div class="d-flex align-center">
        <div style="width: 20px" class="text-blue font-weight-bold">Z</div>
        <v-slider v-model="clipZ" :min="-100" :max="100" hide-details class="ml-2" color="blue"></v-slider>
      </div>
    </div>

    <div id="three-container" class="w-100 h-100"></div>
  </div>
</v-container>
