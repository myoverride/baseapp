<v-container fluid class="pa-4 bg-grey-darken-4 h-100" style="min-height: calc( 100vh - 76px ); display: flex; flex-direction: column;">
  <div class="d-flex justify-space-between align-center mb-4">
    <h2 class="text-h6 font-weight-bold text-success font-monospace">
      <v-icon color="success" class="mr-2">mdi-console-line</v-icon>
      {{ $t('customPage.terminal.title') }}
    </h2>
    <v-chip color="error" variant="flat" size="small">
      <v-icon left size="small" class="mr-1">mdi-alert</v-icon> {{ $t('customPage.terminal.warningLive') }}
    </v-chip>
  </div>

  <v-card class="flex-grow-1 d-flex flex-column bg-black rounded-lg border" style="border-color: #4caf50 !important; border-width: 2px !important; overflow: hidden; max-height: calc(100vh - 205px);">
    <div ref="terminalLog" class="flex-grow-1 pa-4 overflow-y-auto font-monospace text-caption" style="color: #0f0;">
      <div v-for="(log, i) in history" :key="i" class="mb-3">
        <div class="text-info font-weight-bold" style="opacity: 0.9;">root@server:~# {{ log.cmd }}</div>
        
        <!-- Renk Formatlayıcı Devrede -->
        <div v-if="log.out" style="white-space: pre-wrap; word-break: break-all; opacity: 0.9; margin-top: 4px;" v-html="formatAnsi(log.out)"></div>
        <div v-if="log.err" class="text-error" style="white-space: pre-wrap; word-break: break-all; margin-top: 4px;" v-html="formatAnsi(log.err)"></div>
      </div>
    </div>
    <v-divider color="success"></v-divider>
    <div class="d-flex align-center pa-2 bg-grey-darken-4">
      <span class="text-success font-monospace mr-2 font-weight-bold">root@server:~#</span>
      <v-text-field
        v-model="command"
        @keyup.enter="sendCommand"
        @keydown="handleKeyDown"
        density="compact"
        hide-details
        variant="plain"
        class="font-monospace flex-grow-1"
        :loading="loading"
        :disabled="loading"
        autofocus
        autocomplete="off"
        :placeholder="$t('customPage.terminal.commandPlaceholder')"
        style="color: #0f0 !important;"
      ></v-text-field>
      <v-btn v-if="loading" color="error" size="small" variant="flat" class="ml-2" @click="sendCtrlC">
        <v-icon class="mr-1">mdi-stop</v-icon> {{ $t('customPage.terminal.stop') }}
      </v-btn>
    </div>
  </v-card>
</v-container>
