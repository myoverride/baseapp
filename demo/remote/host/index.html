<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Desktop Host</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
    h2 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; color: #555; }
    #log { margin-top: 15px; background: #222; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Remote Host</h2>
  <div class="form-group">
    <label>Server URL (ws://...)</label>
    <input type="text" id="serverUrl" value="ws://localhost:3000/api/ws/tenant/master/remote">
  </div>
  <div class="form-group">
    <label>Room ID</label>
    <input type="text" id="roomId" placeholder="Enter Room ID">
  </div>
  <button id="startBtn">Start Host</button>
  <button id="stopBtn" disabled>Stop Host</button>
  
  <div id="status">Status: Disconnected</div>
  <div id="log"></div>

  <script src="renderer.js"></script>
</body>
</html>
