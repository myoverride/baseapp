<v-container fluid class="fill-height bg-grey-darken-4 pa-0 d-flex flex-column align-center justify-center">
  <div v-if="!connected" class="text-center">
    <v-icon icon="mdi-remote-desktop" size="64" color="cyan" class="mb-4"></v-icon>
    <h2 class="text-h4 text-white mb-6">Uzaktan Masaüstü</h2>
    <v-card width="400" color="grey-darken-3" class="pa-6 rounded-xl mx-auto">
      <v-text-field v-model="roomId" label="9 Haneli Oda Kimliği" variant="outlined" color="cyan" class="mb-4" hide-details></v-text-field>
      <v-btn color="cyan" block size="large" class="font-weight-bold" @click="connect" :loading="connecting">Bağlan</v-btn>
    </v-card>
  </div>
  <div v-else style="width: 100%; height: 100%; position: relative;">
    <video id="remoteVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: contain;"></video>
    <v-btn icon="mdi-close" color="error" style="position: absolute; top: 16px; right: 16px; z-index: 10;" @click="disconnect"></v-btn>

    <!-- Fare Kontrolleri -->
    <v-card style="position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 10;" class="pa-2 rounded-xl d-flex align-center gap-2" color="rgba(30,30,30,0.8)">
       <v-btn icon="mdi-mouse" variant="text" color="cyan" @click="sendAction({type: 'click', button: 0})" title="Sol Tık"></v-btn>
       <v-btn icon="mdi-mouse-variant" variant="text" color="cyan" @click="sendAction({type: 'click', button: 2})" title="Sağ Tık"></v-btn>
       <v-divider vertical class="mx-2"></v-divider>
       <v-btn icon="mdi-chevron-up" variant="text" color="white" @click="sendAction({type: 'scroll', deltaY: -150})" title="Yukarı Kaydır"></v-btn>
       <v-btn icon="mdi-chevron-down" variant="text" color="white" @click="sendAction({type: 'scroll', deltaY: 150})" title="Aşağı Kaydır"></v-btn>
    </v-card>

    <!-- Sistem Kontrolleri -->
    <v-card style="position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;" class="pa-2 rounded-xl d-flex align-center gap-2" color="rgba(30,30,30,0.8)">
       <v-btn icon="mdi-keyboard" variant="text" color="white" @click="showKeyboard = true" title="Metin Gönder"></v-btn>
       <v-btn icon="mdi-paperclip" variant="text" color="white" @click="triggerFileUpload" title="Dosya Gönder"></v-btn>
       <v-btn icon="mdi-apple-keyboard-command" variant="text" color="white" @click="showShortcuts = true" title="Hızlı Tuşlar & Kombinasyonlar"></v-btn>
    </v-card>

    <input type="file" id="fileInput" style="display: none;" @change="handleFileUpload">
    
    <v-dialog v-model="showKeyboard" max-width="400">
      <v-card color="grey-darken-3">
        <v-card-title>Metin Gönder</v-card-title>
        <v-card-text>
          <v-text-field v-model="textInput" label="Bilgisayara gönderilecek yazı..." variant="outlined" @keyup.enter="sendText" hide-details></v-text-field>
        </v-card-text>
        <v-card-actions>
          <v-spacer></v-spacer>
          <v-btn color="cyan" @click="sendText">Gönder (Enter)</v-btn>
        </v-card-actions>
      </v-card>
    </v-dialog>

    <v-dialog v-model="showShortcuts" max-width="400">
      <v-card color="grey-darken-3">
        <v-card-title>Kombinasyonlar & Tuşlar</v-card-title>
        <v-card-text class="d-flex flex-wrap gap-2">
           <v-btn @click="sendKey(['Control', 'C'])" color="primary" class="ma-1">CTRL+C</v-btn>
           <v-btn @click="sendKey(['Control', 'V'])" color="primary" class="ma-1">CTRL+V</v-btn>
           <v-btn @click="sendKey(['Control', 'A'])" color="primary" class="ma-1">CTRL+A</v-btn>
           <v-btn @click="sendKey(['Control', 'Z'])" color="primary" class="ma-1">CTRL+Z</v-btn>
           <v-btn @click="sendKey(['LeftSuper', 'D'])" color="secondary" class="ma-1">WIN+D</v-btn>
           <v-divider class="w-100 my-2"></v-divider>
           <v-btn @click="sendKey(['Enter'])" class="ma-1">Enter</v-btn>
           <v-btn @click="sendKey(['Backspace'])" class="ma-1">Sil</v-btn>
           <v-btn @click="sendKey(['Escape'])" class="ma-1">ESC</v-btn>
           <v-btn @click="sendKey(['Tab'])" class="ma-1">TAB</v-btn>
           <v-btn @click="sendKey(['Space'])" class="ma-1">Boşluk</v-btn>
        </v-card-text>
      </v-card>
    </v-dialog>
  </div>
</v-container>
